services:
  db:
    image: postgres:15
    container_name: afis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: djia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d djia"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: afis-backend
    restart: unless-stopped
    env_file:
      - path: .env   # LLM_API_KEY=... (copy từ .env.example)
        required: false
    environment:
      POSTGRES_HOST: db
      # Bắt buộc: thiếu key thì `docker compose up` dừng ngay và báo lỗi rõ ràng
      LLM_API_KEY: ${LLM_API_KEY:?Chưa có LLM_API_KEY. Tạo file .env từ .env.example và điền key Groq (https://console.groq.com/keys)}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"   # Django admin: http://localhost:8000/admin

  frontend:
    build:
      context: ./frontend
    container_name: afis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"     # App: http://localhost:5173

volumes:
  postgres_data:
