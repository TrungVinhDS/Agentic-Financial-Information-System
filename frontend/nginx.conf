server {
    listen 80;
    root /usr/share/nginx/html;

    # index.html luôn tải mới: build lại frontend là trình duyệt nhận code mới ngay (không chạy JS cũ trong cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # file JS/CSS có mã băm trong tên: đổi nội dung là đổi tên, cache lâu được
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Một câu hỏi chạy 3-5 lượt LLM, mặc định 60s của nginx sẽ trả 504
        proxy_read_timeout 300s;
    }
}
