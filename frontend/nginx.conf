server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Một câu hỏi chạy 3-5 lượt LLM, mặc định 60s của nginx sẽ trả 504
        proxy_read_timeout 300s;
    }
}
